# 路径：.github/workflows/monitor.yml
name: Crypto-Monitor-Task

# YAML 1.1 会把裸关键字 on 解析成布尔 true，导致 Actions 识别不到触发器；必须加引号
#
# 关于 schedule：GitHub 不保证严格每 15 分钟执行，高负载时可能延迟 30 分钟以上；
# 且整点前后负载高，官方文档建议错峰。故使用 7,22,37,52 分（UTC）而非 */15。
# 若仍长时间无运行：仓库 Actions 里确认本 workflow 未被 Disable；公开库 60 天无活动会停定时，需再 push。
# 可靠方案：用 PAT + curl 每 15 分钟触发 workflow_dispatch，或下面 repository_dispatch。
# 文档：https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
"on":
  schedule:
    - cron: "7,22,37,52 * * * *" # 约每 15 分钟（UTC），错峰整点
  workflow_dispatch: # 网页手动 / API: .../actions/workflows/monitor.yml/dispatches
  repository_dispatch:
    types: [monitor-tick] # 外部: POST .../repos/OWNER/REPO/dispatches，event_type=monitor-tick

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: 检查代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 使用缓存保留 last_status.json，供下次运行与本次扫描对比（白底/浅黄底）
      - name: 恢复状态缓存
        uses: actions/cache/restore@v4
        with:
          path: last_status.json
          key: crypto-status-${{ github.run_id }}
          restore-keys: |
            crypto-status-

      - name: 运行监控脚本
        env:
          # 须在仓库 Settings → Secrets → Actions 中创建同名 Repository secrets（缺一则为空，load_config 会报错）
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          MAIL_163_ACCOUNT: ${{ secrets.MAIL_163_ACCOUNT }}
          MAIL_163_AUTH_CODE: ${{ secrets.MAIL_163_AUTH_CODE }}
          MAIL_163_TO: ${{ secrets.MAIL_163_TO }}
        run: python main.py

      # 运行结束后，把最新的状态存入缓存
      - name: 保存状态缓存
        if: hashFiles('last_status.json') != ''
        uses: actions/cache/save@v4
        with:
          path: last_status.json
          key: crypto-status-${{ github.run_id }}
